# XcodeGen project definition. Generate with `make gen`; the .xcodeproj is not committed.
name: FortiVPNManager

options:
  bundleIdPrefix: com.qoor
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    # Bumped on every `make build`; app and helper compare it as their BuildID.
    CURRENT_PROJECT_VERSION: "1"
    # The app's version, from VERSION at the repository root, which `make gen` passes as FVM_VERSION.
    MARKETING_VERSION: ${FVM_VERSION}
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_SWIFT_FLAGS: $(inherited) -warn-implicit-overrides -strict-memory-safety
    OTHER_LDFLAGS: $(inherited) -Wl,-fatal_warnings

targets:
  FortiVPNManager:
    type: application
    platform: macOS
    sources:
      - path: user/app/macos
      - path: user/ui/macos
      - path: packaging/macos/Support/LaunchDaemons/com.qoor.FortiVPNManager.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      # An Icon Composer document, so macOS draws the Dark, Clear and Tinted icons itself.
      - path: packaging/macos/AppIcon.icon
      - path: packaging/macos/OpenConnect-licenses
        type: folder
    info:
      path: packaging/macos/Support/App-Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: FortiVPNManager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoor.FortiVPNManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The sources state their isolation themselves, as the contract's types are nonisolated.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # UI text is English in code; Korean lives in the string catalog.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # The Rust static library is built for Apple Silicon only.
        ARCHS: arm64
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        # cargo reads the source tree and writes under DerivedData, the OpenConnect build writes the
        # ~/.cache/fvm-openconnect cache, and the OAuth-client script below reads an optional,
        # gitignored file: all outside declared inputs and outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Check formatting and lints
        basedOnDependencyAnalysis: false
        script: 'env -u SYSROOT CARGO_TARGET_DIR="$OBJROOT/cargo-check" "$SRCROOT/scripts/check.sh"'
      - name: Build Rust app library
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/packaging/macos/scripts/build-rust.sh" fvm-user-app'
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libfvm_user_app.a
      - name: Build Rust Helper
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/packaging/macos/scripts/build-rust.sh" fvm-system-helper FortiVPNManagerHelper com.qoor.FortiVPNManager.Helper'
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/FortiVPNManagerHelper
    postBuildScripts:
      - name: Embed Google OAuth client
        basedOnDependencyAnalysis: false
        script: |
          # Copies the gitignored Desktop-app OAuth client (packaging/GoogleOAuthClient.json) into the app
          # bundle. Without it the app still builds; users then import a client JSON in Settings.
          src="${SRCROOT}/packaging/GoogleOAuthClient.json"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleOAuthClient.json"
          if [ -f "$src" ]; then
            install -m 644 "$src" "$dst"
          else
            rm -f "$dst"
            echo "warning: packaging/GoogleOAuthClient.json not found; building without a built-in Google OAuth client."
          fi

schemes:
  FortiVPNManager:
    build:
      targets:
        FortiVPNManager: all
