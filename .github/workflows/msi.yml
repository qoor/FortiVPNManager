name: MSI

# Builds the Windows installer as packaging/windows/build.ps1 describes and uploads it with its
# symbols as the artifact "msi". CI and the release workflow call it.
on:
  workflow_call:
    inputs:
      oauth-client:
        description: Build in the Google OAuth client from the repository secret GOOGLE_OAUTH_CLIENT_JSON
        type: boolean
        default: false
    secrets:
      GOOGLE_OAUTH_CLIENT_JSON:
        required: false

jobs:
  msi:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf autoconf automake libtool make perl
            curl git zip unzip
      - id: openconnect
        shell: pwsh
        run: |
          $env:MSYSTEM = 'UCRT64'
          $env:PATH = 'C:\msys64\ucrt64\bin;C:\msys64\usr\bin'
          $zip = C:\msys64\usr\bin\bash.exe packaging/openconnect/build.sh windows path
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "key=$([IO.Path]::GetFileNameWithoutExtension($zip))" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.openconnect.outputs.zip }}
          key: openconnect-${{ steps.openconnect.outputs.key }}
      - run: rustup update --no-self-update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Korean time, like local builds: the runner's clock is UTC, and a later build must not get a
      # smaller number.
      - run: tzutil /s "Korea Standard Time"
      # The client is kept out of the repository (GitHub's push protection refuses it), so release
      # builds take it from the secret; build.ps1 builds it in when the file is there.
      - if: inputs.oauth-client
        env:
          CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if (-not $env:CLIENT) { throw 'the repository secret GOOGLE_OAUTH_CLIENT_JSON is not set' }
          [IO.File]::WriteAllText((Join-Path $PWD 'packaging\GoogleOAuthClient.json'), $env:CLIENT)
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: msi
          path: |
            .build/windows/FortiVPNManager-*.msi
            .build/windows/FortiVPNManager-*.pdb
          include-hidden-files: true
          if-no-files-found: error
