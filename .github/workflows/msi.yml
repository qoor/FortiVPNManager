name: MSI

# Builds the Windows installer as packaging/windows/build.ps1 describes and uploads it with its
# symbols as the artifact "msi". CI and the release workflow call it.
on:
  workflow_call:
    inputs:
      oauth-client:
        description: Build in the Google OAuth client from the repository secret GOOGLE_OAUTH_CLIENT_JSON
        type: boolean
        default: false
    secrets:
      GOOGLE_OAUTH_CLIENT_JSON:
        required: false

jobs:
  openconnect:
    name: OpenConnect
    uses: ./.github/workflows/openconnect-windows.yml

  msi:
    name: Windows
    needs: openconnect
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v6
        with:
          path: .build/openconnect-windows.zip
          key: openconnect-${{ needs.openconnect.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - run: rustup update --no-self-update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Korean time, like local builds: the runner's clock is UTC, and a later build must not get a
      # smaller number.
      - id: build
        run: |
          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Korea Standard Time')
          "number=$($now.ToString('yyyyMMddHHmmss'))" >> $env:GITHUB_OUTPUT
      # The client is kept out of the repository (GitHub's push protection refuses it), so release
      # builds take it from the secret; build.ps1 builds it in when the file is there.
      - if: inputs.oauth-client
        env:
          CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if (-not $env:CLIENT) { throw 'the repository secret GOOGLE_OAUTH_CLIENT_JSON is not set' }
          [IO.File]::WriteAllText((Join-Path $PWD 'packaging\GoogleOAuthClient.json'), $env:CLIENT)
      - run: cargo build --release --package fvm-helper-windows
        env:
          FVM_BUILD: ${{ steps.build.outputs.number }}
      - run: cargo rustc --release --package fvm-runtime --lib --crate-type cdylib
      - run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1
          -Build ${{ steps.build.outputs.number }} -RustOutput target\release
          -OpenConnect .build\openconnect-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: msi
          path: |
            .build/windows/FortiVPNManager-*.msi
            .build/windows/FortiVPNManager-*.pdb
          include-hidden-files: true
          if-no-files-found: error
