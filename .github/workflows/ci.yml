name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-macos:
    name: Rust (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup update --no-self-update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: brew install autoconf automake libtool pkgconf
      - id: openconnect
        run: |
          zip=$(packaging/openconnect/build.sh macos path)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "key=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.openconnect.outputs.zip }}
          key: openconnect-${{ steps.openconnect.outputs.key }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf autoconf automake libtool make perl
            curl git zip unzip
      - id: openconnect
        shell: pwsh
        run: |
          $env:MSYSTEM = 'UCRT64'
          $env:PATH = 'C:\msys64\ucrt64\bin;C:\msys64\usr\bin'
          $zip = C:\msys64\usr\bin\bash.exe packaging/openconnect/build.sh windows path
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "key=$([IO.Path]::GetFileNameWithoutExtension($zip))" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.openconnect.outputs.zip }}
          key: openconnect-${{ steps.openconnect.outputs.key }}
      - run: rustup update --no-self-update stable && rustup default stable && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      # The macOS Helper's Rust start is macOS only.
      - run: cargo clippy --workspace --exclude fvm-helper-macos --all-targets -- -D warnings
      # The Helper's exception-route and VPN network tests, which read the PC's primary network and
      # change its routing table or WINS servers directly or through the pipe, were not tried on
      # this runner.
      - run: >-
          cargo test --workspace --exclude fvm-helper-macos --
          --skip routes::tests::a_change_for_a_network_that_changed_since_it_was_read_changes_nothing
          --skip routes::tests::exception_routes_are_added_found_and_removed
          --skip routes::tests::routes_this_helper_does_not_write_are_refused_before_any_change
          --skip routes::tests::the_primary_network_is_read
          --skip network::tests::split_settings_are_applied_changed_and_reverted_on_the_loopback_interface
          --skip network::tests::an_apply_through_a_router_that_is_no_longer_current_changes_nothing
          --skip network::tests::wins_servers_set_on_the_loopback_interface_are_cleared_by_its_guid
          --skip changes::tests::windows_reports_a_route_that_comes_and_goes
          --skip the_bypass_routes_are_read_after_the_build_check
          --skip a_connection_has_one_route_request_at_a_time
      - run: >-
          cargo test -p fvm-runtime --
          --ignored --exact os::windows::tests::a_secret_is_written_read_replaced_and_deleted

  csharp-windows:
    name: C# (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet build packaging/windows/FortiVPNManager.slnx -c Release -warnaserror
      - run: dotnet test packaging/windows/FortiVPNManager.slnx -c Release --no-build -warnaserror

  msi:
    name: MSI
    uses: ./.github/workflows/msi.yml

  # Without a signing key; the release workflow builds the signed package.
  pkg:
    name: pkg
    uses: ./.github/workflows/pkg.yml

  swift-macos:
    name: Swift (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - run: git ls-files -z '*.swift' | xargs -0 xcrun swift-format lint --strict
      - run: brew install xcodegen
      - run: FVM_VERSION="$(cat VERSION)" xcodegen generate --spec packaging/macos/project.yml
      # The test bundles need no signing identity.
      - run: |
          for scheme in ContractTests AppSwiftTests; do
            xcodebuild -project packaging/macos/FortiVPNManager.xcodeproj -scheme "$scheme" \
              -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO test
          done
