name: OpenConnect (Windows)

on:
  workflow_call:
    outputs:
      key:
        value: ${{ jobs.openconnect.outputs.key }}

jobs:
  openconnect:
    name: OpenConnect
    runs-on: macos-26
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: brew install autoconf automake libtool pkgconf mingw-w64
      - id: key
        run: |
          zip=$(packaging/openconnect/build.sh windows path)
          echo "key=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: .build/openconnect-windows.zip
          key: openconnect-${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true
      - if: steps.restore.outputs.cache-hit != 'true'
        run: |
          zip=$(packaging/openconnect/build.sh windows)
          mkdir -p .build
          cp "$zip" .build/openconnect-windows.zip
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/openconnect-windows.zip
          key: openconnect-${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
