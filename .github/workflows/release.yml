name: Release

# A version tag (v…) publishes the Windows installer as a public GitHub Release, built with the
# Google OAuth client from the repository secret; a manual run makes a draft release instead, to try
# the result before a tag. A tag is v and the version in VERSION; any other stops before the build.
# The macOS installer package is added to the same Release from a Mac (scripts/release-pkg.sh), as
# the app is signed with that Mac's certificate.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: github.ref_type == 'tag'
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version, the version in VERSION"
            exit 1
          fi

  msi:
    name: MSI
    needs: version
    uses: ./.github/workflows/msi.yml
    with:
      oauth-client: true
    secrets:
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}

  release:
    name: Release
    needs: msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: msi
          path: msi
      - working-directory: msi
        run: sha256sum FortiVPNManager-* > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" msi/* -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "test-$GITHUB_RUN_NUMBER" msi/* -R "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "Test build $GITHUB_RUN_NUMBER" --generate-notes
          fi
