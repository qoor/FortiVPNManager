[package]
name = "fvm-runtime"
edition.workspace = true
publish.workspace = true

[lib]
# The static library links into the Swift app; the Rust library is what the tests link against.
crate-type = ["staticlib", "lib"]

[dependencies]
fvm-backend-adapter.workspace = true
fvm-contract.workspace = true
fvm-core.workspace = true
getrandom.workspace = true
# The time zone database the OS keeps, for local times in the schedule and the log; Windows keeps
# none, so there a copy is bundled.
jiff = { workspace = true, features = ["tzdb-zoneinfo", "tzdb-bundle-platform"] }
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
socket2.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
