<text class="tl" x="338" y="241">기능 요청 · 이벤트</text>
<line class="ar" x1="420" y1="126" x2="420" y2="68" marker-end="url(#sm)"/>
<text class="tl" x="428" y="104">사용</text>
<line class="ar" x1="544" y1="166" x2="616" y2="166" marker-start="url(#sm)" marker-end="url(#sm)"/>
<text class="ts" x="580" y="156" text-anchor="middle">요청 · 보고</text>
<rect class="b-proc" x="600" y="90" width="340" height="330" rx="14"/>
