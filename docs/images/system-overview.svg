<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="전체 구성: 앱 프로세스에는 UI, OS 연동, 런타임, 판단 코어가 있고, Helper 프로세스에는 OS 연동 Helper, Helper entry, watchdog, backend adapter가 있다. 앱과 Helper는 요청과 보고를 주고받고, 런타임은 Gmail·Google과 파일을, watchdog은 backend adapter를 써서 openfortivpn을 다룬다.">
<style>
text { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.bg { fill: #ffffff; }
.b-common { fill: #fbece4; stroke: #b0441b; stroke-width: 1.4; }
.b-mac { fill: #e6ecf4; stroke: #44607f; stroke-width: 1.4; }
.b-ext { fill: #ffffff; stroke: #5a6371; stroke-width: 1.2; stroke-dasharray: 5 4; }
.b-proc { fill: none; stroke: #5a6371; stroke-width: 1.4; stroke-dasharray: 2 3; }
.tb { font-size: 14.5px; font-weight: 700; fill: #1b1f26; }
.tt { font-size: 13px; font-weight: 600; fill: #1b1f26; }
.ts { font-size: 11.5px; fill: #5a6371; }
.tl { font-size: 11.5px; fill: #1b1f26; }
.tc { font-size: 12px; font-weight: 600; fill: #5a6371; }
.ar { stroke: #1b1f26; stroke-width: 1.3; fill: none; }
.ah { fill: #1b1f26; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #191c21; }
  .b-common { fill: #33211a; stroke: #e6844f; }
  .b-mac { fill: #1d2532; stroke: #94acce; }
  .b-ext { fill: #191c21; stroke: #9ba4b1; }
  .b-proc { stroke: #9ba4b1; }
  .tb, .tt, .tl { fill: #e7e9ed; }
  .ts, .tc { fill: #9ba4b1; }
  .ar { stroke: #e7e9ed; }
  .ah { fill: #e7e9ed; }
}
</style>
<rect class="bg" x="0" y="0" width="960" height="600"/>
<defs><marker id="sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="b-ext" x="300" y="12" width="240" height="52" rx="8"/>
<text class="tt" x="420" y="33" text-anchor="middle">macOS</text>
<text class="ts" x="420" y="52" text-anchor="middle">비밀값 저장 · 전원 · 화면 잠금 · 알림</text>
