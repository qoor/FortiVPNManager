<text class="tt" x="770" y="152" text-anchor="middle">OS 연동 Helper (macOS)</text>
<text class="ts" x="770" y="173" text-anchor="middle">앱 연결 확인 · 자가 업데이트</text>
<text class="ts" x="770" y="191" text-anchor="middle">route 복구 · 예외 route 쓰기</text>
