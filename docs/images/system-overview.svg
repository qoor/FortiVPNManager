<rect class="b-common" x="780" y="312" width="140" height="88" rx="8"/>
<text class="tt" x="850" y="336" text-anchor="middle">backend adapter</text>
<text class="ts" x="850" y="358" text-anchor="middle">openfortivpn</text>
<text class="ts" x="850" y="376" text-anchor="middle">나중에 openconnect</text>
<line class="ar" x1="770" y1="206" x2="770" y2="240" marker-start="url(#sm)" marker-end="url(#sm)"/>
<text class="ts" x="778" y="227">요청 · 이벤트</text>
<line class="ar" x1="690" y1="292" x2="690" y2="308" marker-end="url(#sm)"/>
<line class="ar" x1="762" y1="356" x2="776" y2="356" marker-end="url(#sm)"/>
<rect class="b-ext" x="40" y="470" width="230" height="56" rx="8"/>
<text class="tt" x="155" y="494" text-anchor="middle">Gmail · Google</text>
<text class="ts" x="155" y="513" text-anchor="middle">OTP 메일 · 계정 인증</text>
<line class="ar" x1="155" y1="404" x2="155" y2="466" marker-start="url(#sm)" marker-end="url(#sm)"/>
<text class="tl" x="163" y="440">통신</text>
<rect class="b-ext" x="300" y="470" width="240" height="56" rx="8"/>
<text class="tt" x="420" y="494" text-anchor="middle">설정 · 상태 · 로그 파일</text>
<text class="ts" x="420" y="513" text-anchor="middle">config.yaml · state.json</text>
<line class="ar" x1="330" y1="404" x2="330" y2="466" marker-start="url(#sm)" marker-end="url(#sm)"/>
<text class="tl" x="338" y="440">읽기 · 쓰기 · 감시</text>
<rect class="b-ext" x="650" y="470" width="240" height="56" rx="8"/>
<text class="tt" x="770" y="494" text-anchor="middle">openfortivpn</text>
<text class="ts" x="770" y="513" text-anchor="middle">VPN client (나중에 openconnect)</text>
<line class="ar" x1="690" y1="404" x2="690" y2="466" marker-start="url(#sm)" marker-end="url(#sm)"/>
<text class="tl" x="698" y="440">실행 · 입력 · 출력</text>
<rect class="b-common" x="40" y="556" width="18" height="14" rx="3"/>
<text class="tl" x="66" y="567">모든 OS 공통</text>
