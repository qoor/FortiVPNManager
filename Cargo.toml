[workspace]
resolver = "3"
members = [
    "components/backend-adapter",
    "components/contract",
    "components/core",
    "components/helper-entry/macos",
    "components/runtime",
    "components/watchdog",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
base64 = "0.23"
encoding_rs = "0.8"
fvm-backend-adapter = { path = "components/backend-adapter" }
fvm-contract = { path = "components/contract" }
fvm-core = { path = "components/core" }
fvm-watchdog = { path = "components/watchdog" }
# Civil time in a time zone the runtime resolved; nothing that reads the system database.
jiff = { version = "0.2.41", default-features = false, features = ["std"] }
libproc = "0.15"
nix = "0.31"
rustix = "1"
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# `all` exposes set_nosigpipe.
socket2 = { version = "0.6", features = ["all"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Keeps file and line numbers in crash reports.
debug = "line-tables-only"
