[workspace]
resolver = "3"
members = [
    "common/base",
    "common/os-api",
    "system/connection",
    "system/helper",
    "system/log",
    "system/openconnect",
    "system/protocol",
    "system/service",
    "user/app",
    "user/connection",
    "user/log",
    "user/protocol",
    "user/service",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
fvm-common-base = { path = "common/base" }
fvm-system-protocol = { path = "system/protocol" }
fvm-user-protocol = { path = "user/protocol" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Keeps file and line numbers in crash reports.
debug = "line-tables-only"
