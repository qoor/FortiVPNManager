# XcodeGen project definition. Generate with `make gen`; the .xcodeproj is not committed.
name: FortiVPNManager

options:
  bundleIdPrefix: com.qoor
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    # Bumped on every `make build`; app and helper compare it as their BuildID.
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  FortiVPNManager:
    type: application
    platform: macOS
    sources:
      # The Helper's messages to its entry, and the XPC payloads only the Helper's Swift side
      # handles, are not the app's.
      - path: ../../components/contract/macos
        excludes:
          - "HelperInternal.swift"
          - "xpc/BypassRouteMessages.swift"
          - "xpc/HelperError.swift"
      - path: ../../components/ui/macos
      - path: ../../components/os-integration/macos
      - path: ../../components/runtime/macos/swift
      - path: Support/LaunchDaemons/com.qoor.FortiVPNManager.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Support/App-Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: FortiVPNManager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoor.FortiVPNManager
        # The sources state their isolation themselves, as the contract's types are nonisolated.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # UI text is English in code; Korean lives in components/ui/macos/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # The Rust static library is built for Apple Silicon only.
        ARCHS: arm64
        # The header and module map of the Rust start function; build-rust.sh puts the library in
        # BUILT_PRODUCTS_DIR.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../components/runtime/macos/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        # cargo reads the source tree and writes under DerivedData, and the OAuth-client script below
        # reads an optional, gitignored file: both outside declared inputs and outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust runtime
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/build-rust.sh" fvm-runtime'
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libfvm_runtime.a
    postBuildScripts:
      - name: Embed Google OAuth client
        basedOnDependencyAnalysis: false
        script: |
          # Copies the gitignored Desktop-app OAuth client (packaging/GoogleOAuthClient.json) into the app
          # bundle. Without it the app still builds; users then import a client JSON in Settings.
          src="${SRCROOT}/../GoogleOAuthClient.json"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleOAuthClient.json"
          if [ -f "$src" ]; then
            install -m 644 "$src" "$dst"
          else
            rm -f "$dst"
            echo "warning: packaging/GoogleOAuthClient.json not found; building without a built-in Google OAuth client."
          fi
    dependencies:
      - target: FortiVPNManagerHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables

  FortiVPNManagerHelper:
    type: tool
    platform: macOS
    sources:
      - path: ../../components/os-integration-helper/macos
      # The app's messages to its runtime are not the Helper's.
      - path: ../../components/contract/macos
        excludes:
          - "app/**"
      - path: ../../components/helper-entry/macos/swift
    settings:
      base:
        PRODUCT_NAME: FortiVPNManagerHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.qoor.FortiVPNManager.Helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Keep the signing identifier stable: launchd pins it at the first register().
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # The Rust static library is built for Apple Silicon only.
        ARCHS: arm64
        # The header and module map of the Rust start function; build-rust.sh puts the library in
        # BUILT_PRODUCTS_DIR.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../components/helper-entry/macos/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        # cargo reads the source tree and writes under DerivedData, outside declared inputs and outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust Helper entry
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/build-rust.sh" fvm-helper-entry-macos'
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libfvm_helper_entry_macos.a

  # The Swift side of the contract against the Rust fixtures; needs no Rust library.
  ContractTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../../components/contract/macos
      - path: ../../components/contract/tests/macos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoor.FortiVPNManager.ContractTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  # The app's Swift parts (UI and OS integration) on the contract, without the Rust runtime.
  AppSwiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../../components/contract/macos
        excludes:
          - "HelperInternal.swift"
          - "xpc/BypassRouteMessages.swift"
          - "xpc/HelperError.swift"
      - path: ../../components/ui/macos
      - path: ../../components/os-integration/macos
        excludes:
          - "AppEntry.swift"
      - path: ../../components/ui/tests/macos
      - path: ../../components/os-integration/tests/macos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoor.FortiVPNManager.AppSwiftTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  # Helper sources that are testable without the Helper process.
  HelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../../components/os-integration-helper/macos/NetworkSetupRoutes.swift
      - path: ../../components/contract/macos/xpc/BypassRouteMessages.swift
      - path: ../../components/contract/macos/xpc/HelperError.swift
      - path: ../../components/os-integration-helper/tests/macos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoor.FortiVPNManager.HelperTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  FortiVPNManager:
    build:
      targets:
        FortiVPNManager: all
        FortiVPNManagerHelper: all
  ContractTests:
    build:
      targets:
        ContractTests: [test]
    test:
      targets: [ContractTests]
  HelperTests:
    build:
      targets:
        HelperTests: [test]
    test:
      targets: [HelperTests]
  AppSwiftTests:
    build:
      targets:
        AppSwiftTests: [test]
    test:
      targets: [AppSwiftTests]
